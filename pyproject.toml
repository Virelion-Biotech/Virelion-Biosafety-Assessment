[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virelion-biosafety-assessment"
version = "1.0.0"
description = "Biosafety Level (BSL) assessment CLI/tool for cardiac stem-cell and gene-therapy laboratory work"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Virelion Biotech" }]
keywords = ["biosafety", "bsl", "ibc", "lab-safety", "gene-therapy", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
virelion-bsa = "biosafety_assessment.cli:main"

[project.urls]
Homepage = "https://github.com/Virelion-Biotech/virelion-biosafety-assessment"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
